[package]
name = "shiba-catalog"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
description = "Clean-room PostgreSQL catalog foundation for Shiba V2"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["pg17"]
pg17 = ["pgrx/pg17"]
pg18 = ["pgrx/pg18"]

[dependencies]
pgrx = { version = "=0.19.1", default-features = false }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
