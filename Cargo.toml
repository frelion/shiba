[package]
name = "shiba"
version = "0.1.0"
edition = "2021"
build = "build.rs"
license = "PostgreSQL"
description = "Single-node incremental materialized views for PostgreSQL"
repository = "https://github.com/frelion/shiba"
readme = "README.md"
keywords = ["postgresql", "database", "streaming", "materialized-view", "rust"]
categories = ["database", "api-bindings"]

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg17"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg_test = []

[dependencies]
pgrx = "=0.19.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
pgrx-tests = "=0.19.1"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
