[workspace]
members = [
    "crates/shiba-catalog",
    "crates/shiba-compiler",
    "crates/shiba-operator",
    "crates/shiba-protocol",
    "crates/shiba-runtime",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
