name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PG_CONFIG: /usr/lib/postgresql/17/bin/pg_config

jobs:
  correctness:
    name: PostgreSQL 17 correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo \"$VERSION_CODENAME\")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-client-17 postgresql-server-dev-17

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust and pgrx artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.pgrx

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version 0.19.1 --locked

      - name: Initialize pgrx for PostgreSQL 17
        run: cargo pgrx init --pg17 "$PG_CONFIG"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run complete correctness gate
        run: ./scripts/test-all.sh
