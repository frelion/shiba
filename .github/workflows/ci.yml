name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  correctness:
    name: PostgreSQL ${{ matrix.pg_major }} correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        pg_major: [17, 18]
    env:
      PG_CONFIG: /usr/lib/postgresql/${{ matrix.pg_major }}/bin/pg_config
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install PostgreSQL ${{ matrix.pg_major }}
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg ripgrep
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes -o /etc/apt/keyrings/postgresql.gpg
          echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo \"$VERSION_CODENAME\")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y \
            postgresql-${{ matrix.pg_major }} \
            postgresql-client-${{ matrix.pg_major }} \
            postgresql-server-dev-${{ matrix.pg_major }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust and pgrx artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ~/.pgrx
          shared-key: shiba-pg${{ matrix.pg_major }}

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version 0.19.1 --locked

      - name: Reset cached pgrx configuration
        run: rm -f "$HOME/.pgrx/config.toml"

      - name: Initialize pgrx for PostgreSQL ${{ matrix.pg_major }}
        run: cargo pgrx init --pg${{ matrix.pg_major }} "$PG_CONFIG"

      - name: Allow pgrx test extension installation
        run: |
          sudo chown -R "$(id -u):$(id -g)" \
            "$("$PG_CONFIG" --sharedir)/extension" \
            "$("$PG_CONFIG" --pkglibdir)"

      - name: Run complete correctness gate
        run: ./scripts/test-all.sh
