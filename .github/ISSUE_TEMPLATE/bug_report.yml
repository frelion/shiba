name: Bug report
description: Report a reproducible correctness, installation, or runtime issue.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include SQL, logs, and the smallest reproducible setup.
      render: sql
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: PostgreSQL, Shiba, OS, and Rust/cargo-pgrx versions.
    validations:
      required: true
